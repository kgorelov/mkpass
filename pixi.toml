[workspace]
name = "mkpass"
version = "0.1.0"
description = "Command-line password generator"
authors = ["Konstantin Gorelov <konstantin.gorelov@gmail.com>"]
channels = ["conda-forge"]
platforms = ["linux-64", "osx-64", "win-64"]

[dependencies]
cmake = ">=3.20"
ninja = "*"
qt = "5.15.*"
gtest = ">=1.14"
sqlite = "*"
cxx-compiler = "*"

[tasks]
# Configure: Creates the build directory and generates build files
configure = "cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DWITH_GUI=ON -DCMAKE_PREFIX_PATH=$CONDA_PREFIX -DCMAKE_CXX_STANDARD_INCLUDE_DIRECTORIES=$CONDA_PREFIX/include"
# Build: Compiles the project
build = "cmake --build build"
# Test: Runs the test suite
test = "ctest --test-dir build --output-on-failure"
# Run CLI
run = { cmd = "./build/cli/mkpass", depends-on = ["build"] }
# Run GUI
run-gui = { cmd = "./build/gui/mkpass-gui", depends-on = ["build"] }

[target.win-64.tasks]
run = { cmd = "build/cli/mkpass.exe", depends-on = ["build"] }
run-gui = { cmd = "build/gui/mkpass-gui.exe", depends-on = ["build"] }
