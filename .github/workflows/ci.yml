name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    name: Build and Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          pixi-version: latest
          cache: true

      - name: Configure
        run: pixi run configure

      - name: Build
        run: pixi run build

      - name: Initialize font cache
        if: runner.os == 'Linux'
        run: pixi run fc-cache -r || true

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: pixi run test
