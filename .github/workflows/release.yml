name: Release

on:
  push:
    branches:
      - 'release/**'
      - 'release-*'
    tags:
      - '*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-desktop:
    name: Desktop (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x64
          - os: windows-latest
            platform: windows-x64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Pixi
        uses: prefix-dev/setup-pixi@v0.10.2
        with:
          pixi-version: latest
          cache: true

      - name: Configure CMake
        run: pixi run configure

      - name: Build application
        run: pixi run build

      - name: Initialize font cache
        if: matrix.platform == 'linux-x64'
        run: pixi run fc-cache -r || true

      - name: Run test suite
        env:
          QT_QPA_PLATFORM: offscreen
        run: pixi run test

      - name: Package Linux
        if: matrix.platform == 'linux-x64'
        shell: bash
        run: |
          mkdir -p dist
          TAG_NAME="${GITHUB_REF_NAME//\//-}"

          # 1. Build AppImage via pixi task
          pixi run appimage

          # 2. Copy generated AppImage to dist
          cp mkpass-x86_64.AppImage "dist/mkpass-${TAG_NAME}-linux-x86_64.AppImage"

          # 3. Standalone bundle tarball (bundles all Qt libraries & plugins)
          mkdir -p package_bundle/mkpass
          cp -a AppDir/* package_bundle/mkpass/
          if [ -n "$CONDA_PREFIX" ]; then
            cp -d "$CONDA_PREFIX"/lib/libstdc++.so* package_bundle/mkpass/usr/lib/ 2>/dev/null || true
            cp -d "$CONDA_PREFIX"/lib/libgcc_s.so* package_bundle/mkpass/usr/lib/ 2>/dev/null || true
          fi
          cat << 'EOF' | sed 's/^[[:space:]]*//' > package_bundle/mkpass/mkpass-gui
          #!/bin/bash
          HERE="$(dirname "$(readlink -f "$0")")"
          export LD_LIBRARY_PATH="$HERE/usr/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          export QT_PLUGIN_PATH="$HERE/usr/plugins"
          exec "$HERE/usr/bin/mkpass-gui" "$@"
          EOF
          chmod +x package_bundle/mkpass/mkpass-gui
          tar -czvf "dist/mkpass-${TAG_NAME}-linux-x86_64-bundle.tar.gz" -C package_bundle mkpass

          # 4. Standalone CLI tarball (mostly-static)
          pixi run cli-mostly-static || true
          mkdir -p package_cli/mkpass
          if [ -f build-cli-mostly/cli/mkpass ]; then
            cp build-cli-mostly/cli/mkpass package_cli/mkpass/
          else
            cp build/cli/mkpass package_cli/mkpass/
          fi
          tar -czvf "dist/mkpass-${TAG_NAME}-linux-x86_64-cli.tar.gz" -C package_cli mkpass

          # 5. Native deb and rpm packages
          sudo apt-get update
          sudo apt-get install -y debhelper fakeroot dpkg-dev rpm build-essential cmake libsqlite3-dev libgtest-dev qtbase5-dev || \
          sudo apt-get install -y debhelper fakeroot dpkg-dev rpm build-essential cmake libsqlite3-dev libgtest-dev qt6-base-dev
          ./scripts/package_linux.sh

      - name: Install Windows packaging tools
        if: matrix.platform == 'windows-x64'
        shell: bash
        run: |
          choco install innosetup wixtoolset -y
          echo "C:\Program Files (x86)\Inno Setup 6" >> "$GITHUB_PATH"
          echo "C:\Program Files (x86)\WiX Toolset v3.11\bin" >> "$GITHUB_PATH"

      - name: Package Windows
        if: matrix.platform == 'windows-x64'
        shell: bash
        run: |
          pixi run package

      - name: Upload desktop artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mkpass-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error

  build-android:
    name: Android (APK)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build Android APK
        working-directory: android
        run: ./gradlew assembleRelease || ./gradlew assembleDebug

      - name: Package Android Artifact
        shell: bash
        run: |
          mkdir -p dist
          TAG_NAME="${GITHUB_REF_NAME//\//-}"
          APK_FILE=$(find android/app/build/outputs/apk/release -name "*.apk" 2>/dev/null | head -n 1)
          if [ -z "$APK_FILE" ]; then
            APK_FILE=$(find android/app/build/outputs/apk -name "*.apk" | head -n 1)
          fi
          if [ -n "$APK_FILE" ]; then
            cp "$APK_FILE" "dist/mkpass-${TAG_NAME}-android.apk"
          else
            echo "Error: No APK file generated" >&2
            exit 1
          fi

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: mkpass-android
          path: dist/*
          if-no-files-found: error

  build-web:
    name: Web (WASM + React)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: '3.1.56'

      - name: Build WebAssembly Core
        run: |
          chmod +x build_wasm.sh
          ./build_wasm.sh

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mkpass_web/package-lock.json

      - name: Build React SPA
        working-directory: mkpass_web
        run: |
          npm ci
          CI=false npm run build
          npm test -- --watchAll=false

      - name: Package Web Distribution
        shell: bash
        run: |
          mkdir -p dist
          TAG_NAME="${GITHUB_REF_NAME//\//-}"
          tar -czvf "dist/mkpass-${TAG_NAME}-web.tar.gz" -C mkpass_web/build .

      - name: Upload Web artifact
        uses: actions/upload-artifact@v4
        with:
          name: mkpass-web
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [build-desktop, build-android, build-web]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: mkpass-*
          path: dist
          merge-multiple: true

      - name: Generate Checksums
        shell: bash
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Inspect release assets
        run: ls -la dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
