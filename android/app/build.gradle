plugins {
    id 'com.android.application'
}

android {
    namespace 'app.mkpass'
    compileSdk 34

    defaultConfig {
        applicationId "app.mkpass"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        externalNativeBuild {
            cmake {
                cppFlags ''
            }
        }
    }

    signingConfigs {
        release {
            def keystoreBase64 = System.getenv("ANDROID_KEYSTORE_BASE64")
            def keystoreFileEnv = System.getenv("KEYSTORE_FILE")
            def keystorePassword = System.getenv("KEYSTORE_PASSWORD")
            def keyAlias = System.getenv("KEY_ALIAS")
            def keyPassword = System.getenv("KEY_PASSWORD")

            if (keystoreBase64) {
                def keystoreFile = file("${buildDir}/release.keystore")
                keystoreFile.parentFile.mkdirs()
                keystoreFile.bytes = keystoreBase64.decodeBase64()
                storeFile keystoreFile
                storePassword keystorePassword ?: ""
                keyAlias keyAlias ?: ""
                keyPassword keyPassword ?: ""
            } else if (keystoreFileEnv && file(keystoreFileEnv).exists()) {
                storeFile file(keystoreFileEnv)
                storePassword keystorePassword ?: ""
                keyAlias keyAlias ?: ""
                keyPassword keyPassword ?: ""
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (System.getenv("ANDROID_KEYSTORE_BASE64") || (System.getenv("KEYSTORE_FILE") && file(System.getenv("KEYSTORE_FILE")).exists())) {
                signingConfig signingConfigs.release
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }
    packagingOptions {
        pickFirst 'lib/x86_64/libstdc++.so'
        pickFirst 'lib/x86/libstdc++.so'
        pickFirst 'lib/armeabi-v7a/libstdc++.so'
        pickFirst 'lib/arm64-v8a/libstdc++.so'
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
